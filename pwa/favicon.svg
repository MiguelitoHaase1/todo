<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background: rounded square in coral -->
  <rect width="512" height="512" rx="96" fill="#2B7CD0"/>

  <!-- Three kanban columns -->
  <!-- Column 1: 3 cards (tall stack) -->
  <rect x="72" y="80" width="108" height="352" rx="16" fill="rgba(255,255,255,0.25)"/>
  <rect x="88" y="104" width="76" height="56" rx="10" fill="#FAF9F6"/>
  <rect x="88" y="176" width="76" height="56" rx="10" fill="#FAF9F6"/>
  <rect x="88" y="248" width="76" height="56" rx="10" fill="#FAF9F6"/>

  <!-- Column 2: 2 cards (medium stack) -->
  <rect x="202" y="80" width="108" height="352" rx="16" fill="rgba(255,255,255,0.25)"/>
  <rect x="218" y="104" width="76" height="56" rx="10" fill="#FAF9F6"/>
  <rect x="218" y="176" width="76" height="56" rx="10" fill="#FAF9F6"/>

  <!-- Column 3: 1 card (short stack) -->
  <rect x="332" y="80" width="108" height="352" rx="16" fill="rgba(255,255,255,0.25)"/>
  <rect x="348" y="104" width="76" height="56" rx="10" fill="#FAF9F6"/>
</svg>
