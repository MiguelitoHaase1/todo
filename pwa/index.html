<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Tasks — The Clearing</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="theme-color" content="#FAF9F6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #FAF9F6;
      --bg-secondary: #F0EFEB;
      --surface: #FFFFFF;
      --border: #E5E4E0;
      --border-medium: #D1D0CC;
      --text: #1A1A1A;
      --text-secondary: #6B6B6B;
      --text-muted: #9B9B9B;
      --coral: #D97757;
      --coral-light: rgba(217, 119, 87, 0.1);
      --coral-hover: #C4654A;
      --sage: #B8C4B8;
      --success: #5A9E6F;
      --danger: #C75450;
      --p0: #C75450;
      --p1: #D97757;
      --p2: #C9A84C;
      --p3: #9B9B9B;
      --p4: #C5C1D6;
      --col-width: min(300px, 85vw);
      --radius-sm: 8px;
      --radius-md: 12px;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      min-height: 100dvh;
      overflow-x: auto;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      font-family: 'Source Serif 4', Georgia, serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .header-actions { display: flex; gap: 8px; align-items: center; }

    .header-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      border-radius: var(--radius-sm);
      padding: 6px 12px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
    }
    .header-btn:hover { color: var(--text); border-color: var(--border-medium); }
    .header-btn.primary {
      background: var(--coral);
      color: white;
      border-color: var(--coral);
    }
    .header-btn.primary:hover { background: var(--coral-hover); border-color: var(--coral-hover); }

    #board {
      display: flex;
      gap: 16px;
      padding: 20px;
      min-height: calc(100dvh - 57px);
      align-items: flex-start;
    }

    .column {
      flex: 0 0 var(--col-width);
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
    }

    .col-header {
      padding: 14px 16px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .col-title {
      font-family: 'Source Serif 4', Georgia, serif;
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    .col-date {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .col-count {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2px 8px;
    }

    .col-tasks {
      padding: 8px 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 60px;
    }

    .col-tasks.drag-over {
      background: var(--coral-light);
      border-radius: var(--radius-sm);
    }

    /* ── Task Cards ──────────────────────────── */
    .task-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      cursor: grab;
      position: relative;
      user-select: none;
      transition: transform 0.1s, opacity 0.1s, border-color 0.15s, box-shadow 0.15s;
    }

    .task-card:active { cursor: grabbing; }
    .task-card.dragging { opacity: 0.4; transform: scale(0.97); }
    .task-card:hover {
      border-color: var(--border-medium);
      box-shadow: var(--shadow);
      transform: translateY(-1px);
    }

    .task-title {
      font-size: 14px;
      color: var(--text);
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .priority-pill {
      font-size: 11px;
      font-weight: 600;
      border-radius: 20px;
      padding: 2px 8px;
      border: 1px solid;
    }

    .pill-p0 { color: var(--p0); border-color: var(--p0); background: rgba(199, 84, 80, 0.08); }
    .pill-p1 { color: var(--p1); border-color: var(--p1); background: var(--coral-light); }
    .pill-p2 { color: var(--p2); border-color: var(--p2); background: rgba(201, 168, 76, 0.08); }
    .pill-p3 { color: var(--p3); border-color: var(--border); background: var(--bg); }
    .pill-p4 { color: var(--p4); border-color: var(--p4); background: rgba(197, 193, 214, 0.1); }

    .task-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
    }

    .footer-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .action-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
      padding: 0;
      flex-shrink: 0;
    }
    .action-btn:hover { color: var(--text); }

    .done-btn {
      width: 32px;
      height: 32px;
      border: 2px solid var(--border-medium);
      border-radius: 8px;
      color: var(--border-medium);
      font-size: 18px;
      background: var(--bg);
    }
    .done-btn:hover { border-color: var(--success); color: var(--success); background: rgba(90, 158, 111, 0.06); }

    .move-wrap {
      position: relative;
      width: 26px;
      height: 26px;
      flex-shrink: 0;
    }
    .move-wrap .move-icon {
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      color: var(--text-muted);
      pointer-events: none;
    }
    .move-wrap:hover .move-icon { color: var(--coral); }
    .move-wrap input[type="date"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
      -webkit-appearance: none;
      border: none;
      padding: 0;
    }

    .drop-x {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 22px;
      height: 22px;
      font-size: 13px;
      color: var(--border-medium);
      opacity: 0;
      transition: opacity 0.15s, color 0.15s;
    }
    .task-card:hover .drop-x { opacity: 1; }
    .drop-x:hover { color: var(--danger); }

    .task-card { cursor: pointer; }

    .empty-state {
      padding: 24px 16px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
    }

    /* ── Toast ──────────────────────────────── */
    #status {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 20px;
      font-size: 13px;
      color: var(--text);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      max-width: 340px;
      text-align: center;
      line-height: 1.4;
      box-shadow: var(--shadow);
      z-index: 200;
    }
    #status.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
    #status .toast-action { font-weight: 600; }
    #status .toast-task { color: var(--text-secondary); }

    /* ── Edit Modal ────────────────────────── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(26, 26, 26, 0.4);
      z-index: 300;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--surface);
      border-radius: 16px 16px 0 0;
      width: 100%;
      max-width: 480px;
      padding: 24px 20px 32px;
      box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.12);
    }

    .modal h2 {
      font-family: 'Source Serif 4', Georgia, serif;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 20px;
      color: var(--text);
    }

    .field { margin-bottom: 16px; }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }

    .field input, .field select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-family: inherit;
      color: var(--text);
      background: var(--bg);
      outline: none;
      transition: border-color 0.15s;
    }
    .field input:focus, .field select:focus { border-color: var(--coral); }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 24px;
    }

    .modal-actions button {
      flex: 1;
      padding: 12px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-cancel {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }
    .btn-cancel:hover { border-color: var(--border-medium); color: var(--text); }

    .btn-save {
      background: var(--coral);
      border: 1px solid var(--coral);
      color: white;
    }
    .btn-save:hover { background: var(--coral-hover); }

    /* ── Scrollbar ──────────────────────────── */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-medium); border-radius: 2px; }

    /* ── Mobile touch ───────────────────────── */
    @media (hover: none) {
      .task-card:hover { transform: none; box-shadow: none; }
      .drop-x { opacity: 0.6; }
    }

    .btn-drop {
      background: none;
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 10px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
      transition: all 0.15s;
    }
    .btn-drop:hover { background: rgba(199, 84, 80, 0.08); }
  </style>
</head>
<body>

<header>
  <h1>Tasks</h1>
  <div class="header-actions">
    <button class="header-btn" id="refresh-btn">↻ Refresh</button>
  </div>
</header>

<div id="board"></div>

<div id="status"></div>

<!-- Edit Modal -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <h2>Edit Task</h2>
    <div class="field">
      <label>Title</label>
      <input type="text" id="edit-title" />
    </div>
    <div class="field">
      <label>Priority</label>
      <select id="edit-priority">
        <option value="0">P0 — Critical</option>
        <option value="1">P1 — High</option>
        <option value="2">P2 — Medium</option>
        <option value="3">P3 — Normal</option>
        <option value="4">P4 — Backlog</option>
      </select>
    </div>
    <div class="field">
      <label>Due Date</label>
      <input type="date" id="edit-date" />
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="edit-cancel">Cancel</button>
      <button class="btn-save" id="edit-save">Save</button>
    </div>
    <button class="btn-drop" id="edit-drop">Drop this task</button>
  </div>
</div>

<script>
  // ── Config ──────────────────────────────────────────────────────────────
  const SB_URL = 'https://xwxsrsybllifbivhgojl.supabase.co';
  const SB_KEY = 'sb_publishable_fcZRHJWzxFYrwfQVmTy0GQ_6DVu0Byk';

  const PRIORITY_LABELS = ['P0', 'P1', 'P2', 'P3', 'P4'];

  // ── Dates ───────────────────────────────────────────────────────────────
  function localDateStr(offset = 0) {
    const d = new Date();
    d.setDate(d.getDate() + offset);
    return d.toISOString().slice(0, 10);
  }

  function colLabel(offset) {
    return ['Today', 'Tomorrow', '+2 days', '+3 days'][offset] || `+${offset}`;
  }

  function formatDate(offset) {
    const d = new Date();
    d.setDate(d.getDate() + offset);
    return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  }

  // ── Supabase ────────────────────────────────────────────────────────────
  function sbHeaders() {
    return {
      apikey: SB_KEY,
      Authorization: `Bearer ${SB_KEY}`,
      'Content-Type': 'application/json',
      Prefer: 'return=representation',
    };
  }

  async function fetchTasks() {
    if (!SB_URL || !SB_KEY) return DEMO_TASKS;
    const from = localDateStr(0);
    const to = localDateStr(3);
    const res = await fetch(
      `${SB_URL}/rest/v1/tasks?select=*&status=eq.open&due_date=gte.${from}&due_date=lte.${to}&order=priority.asc,created_at.asc`,
      { headers: sbHeaders() }
    );
    if (!res.ok) throw new Error(`Fetch failed: ${res.status}`);
    return res.json();
  }

  async function patchTask(taskId, updates) {
    if (!SB_URL || !SB_KEY) return;
    const res = await fetch(`${SB_URL}/rest/v1/tasks?id=eq.${taskId}`, {
      method: 'PATCH',
      headers: sbHeaders(),
      body: JSON.stringify({ ...updates, updated_at: new Date().toISOString() }),
    });
    if (!res.ok) throw new Error(`Update failed: ${res.status}`);
  }

  async function emitEvent(taskId, eventType, prev, next) {
    if (!SB_URL || !SB_KEY) return;
    fetch(`${SB_URL}/rest/v1/task_events`, {
      method: 'POST',
      headers: sbHeaders(),
      body: JSON.stringify({
        task_id: taskId,
        event_type: eventType,
        previous_value: prev,
        new_value: next,
        source: 'pwa',
      }),
    }).catch(() => {});
  }

  // ── Demo data ───────────────────────────────────────────────────────────
  const DEMO_TASKS = [
    { id: 'demo-1', title: 'Review Q2 roadmap', priority: 0, due_date: localDateStr(0), status: 'open' },
    { id: 'demo-2', title: 'Write experiment log', priority: 1, due_date: localDateStr(0), status: 'open' },
    { id: 'demo-3', title: 'Ship kanban PWA', priority: 1, due_date: localDateStr(0), status: 'open' },
    { id: 'demo-4', title: 'Update strategies doc', priority: 2, due_date: localDateStr(1), status: 'open' },
    { id: 'demo-5', title: 'Call with advisor', priority: 0, due_date: localDateStr(1), status: 'open' },
    { id: 'demo-6', title: 'Draft investor update', priority: 2, due_date: localDateStr(2), status: 'open' },
    { id: 'demo-7', title: 'Review product metrics', priority: 3, due_date: localDateStr(3), status: 'open' },
  ];

  // ── State ───────────────────────────────────────────────────────────────
  let tasks = [];
  let draggedId = null;
  let editingId = null;

  // ── Toast ───────────────────────────────────────────────────────────────
  let toastTimer;
  function toast(html) {
    const el = document.getElementById('status');
    el.innerHTML = html;
    el.classList.add('visible');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('visible'), 2800);
  }

  function friendlyDate(dateStr) {
    if (!dateStr) return '';
    const today = localDateStr(0);
    const tomorrow = localDateStr(1);
    if (dateStr === today) return 'today';
    if (dateStr === tomorrow) return 'tomorrow';
    const d = new Date(dateStr + 'T12:00:00');
    return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  }

  function truncate(str, n = 28) {
    return str.length > n ? str.slice(0, n) + '...' : str;
  }

  // ── Board ───────────────────────────────────────────────────────────────
  function buildBoard() {
    const board = document.getElementById('board');
    board.innerHTML = '';

    for (let offset = 0; offset < 4; offset++) {
      const dateStr = localDateStr(offset);
      const colTasks = tasks.filter(t => t.due_date === dateStr);
      const isToday = offset === 0;

      const col = document.createElement('div');
      col.className = 'column';
      col.innerHTML = `
        <div class="col-header">
          <div>
            <div class="col-title">${colLabel(offset)}</div>
            <div class="col-date">${formatDate(offset)}</div>
          </div>
          <span class="col-count">${colTasks.length}</span>
        </div>
        <div class="col-tasks" data-date="${dateStr}">
          ${colTasks.length === 0
            ? '<div class="empty-state">No tasks</div>'
            : colTasks.map(taskCard).join('')}
        </div>
      `;
      board.appendChild(col);
    }

    attachListeners();
  }

  function taskCard(task) {
    const p = task.priority ?? 3;
    return `
      <div class="task-card" draggable="true" data-id="${task.id}">
        <button class="action-btn drop-x" title="Drop" data-id="${task.id}">✕</button>
        <div class="task-title">${escHtml(task.title)}</div>
        <div class="task-footer">
          <div class="footer-left">
            <div class="move-wrap">
              <div class="move-icon">→</div>
              <input type="date" class="move-date" data-id="${task.id}" value="${task.due_date || ''}" title="Move date" />
            </div>
            <span class="priority-pill pill-p${p}">${PRIORITY_LABELS[p]}</span>
          </div>
          <button class="action-btn done-btn" title="Done" data-id="${task.id}">✓</button>
        </div>
      </div>
    `;
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Listeners ───────────────────────────────────────────────────────────
  function attachListeners() {
    // Drag
    document.querySelectorAll('.task-card[draggable]').forEach(card => {
      card.addEventListener('dragstart', e => {
        draggedId = card.dataset.id;
        card.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });
      card.addEventListener('dragend', () => {
        card.classList.remove('dragging');
        draggedId = null;
      });
    });

    document.querySelectorAll('.col-tasks').forEach(zone => {
      zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
      zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
      zone.addEventListener('drop', async e => {
        e.preventDefault();
        zone.classList.remove('drag-over');
        if (!draggedId) return;
        const newDate = zone.dataset.date;
        const task = tasks.find(t => t.id === draggedId);
        if (!task || task.due_date === newDate) return;
        const oldDate = task.due_date;
        task.due_date = newDate;
        buildBoard();
        toast(`<span class="toast-action">Moved to ${friendlyDate(newDate)}</span><br><span class="toast-task">${truncate(task.title)}</span>`);
        try {
          await patchTask(draggedId, { due_date: newDate });
          emitEvent(draggedId, 'deferred', oldDate, newDate);
        } catch {
          toast('Failed — reverting');
          task.due_date = oldDate;
          buildBoard();
        }
      });
    });

    // Done
    document.querySelectorAll('.done-btn').forEach(btn => {
      btn.addEventListener('click', async e => {
        e.stopPropagation();
        const id = btn.dataset.id;
        const task = tasks.find(t => t.id === id);
        const name = task ? truncate(task.title) : '';
        tasks = tasks.filter(t => t.id !== id);
        buildBoard();
        toast(`<span class="toast-action">✓ Done</span><br><span class="toast-task">${name}</span>`);
        try {
          await patchTask(id, { status: 'done' });
          emitEvent(id, 'status_changed', 'open', 'done');
        } catch { /* best effort */ }
      });
    });

    // Drop (✕ top right)
    document.querySelectorAll('.drop-x').forEach(btn => {
      btn.addEventListener('click', async e => {
        e.stopPropagation();
        const id = btn.dataset.id;
        const task = tasks.find(t => t.id === id);
        const name = task ? truncate(task.title) : '';
        tasks = tasks.filter(t => t.id !== id);
        buildBoard();
        toast(`<span class="toast-action">Dropped</span><br><span class="toast-task">${name}</span>`);
        try {
          await patchTask(id, { status: 'dropped' });
          emitEvent(id, 'status_changed', 'open', 'dropped');
        } catch { /* best effort */ }
      });
    });

    // Move date (inline date input on → arrow)
    document.querySelectorAll('.move-date').forEach(input => {
      input.addEventListener('click', e => e.stopPropagation());
      input.addEventListener('change', async e => {
        e.stopPropagation();
        const id = input.dataset.id;
        const newDate = input.value;
        if (!id || !newDate) return;
        const task = tasks.find(t => t.id === id);
        if (!task || task.due_date === newDate) return;
        const oldDate = task.due_date;
        const name = truncate(task.title);
        task.due_date = newDate;
        buildBoard();
        toast(`<span class="toast-action">Moved to ${friendlyDate(newDate)}</span><br><span class="toast-task">${name}</span>`);
        try {
          await patchTask(id, { due_date: newDate });
          emitEvent(id, 'deferred', oldDate, newDate);
        } catch {
          toast('Failed — reverting');
          task.due_date = oldDate;
          buildBoard();
        }
      });
    });

    // Card body click → edit modal (skip if clicking a button or the date input)
    document.querySelectorAll('.task-card').forEach(card => {
      card.addEventListener('click', e => {
        if (e.target.closest('.action-btn') || e.target.closest('.move-wrap')) return;
        openEditModal(card.dataset.id);
      });
    });
  }

  // ── Edit Modal ──────────────────────────────────────────────────────────
  function openEditModal(taskId) {
    const task = tasks.find(t => t.id === taskId);
    if (!task) return;
    editingId = taskId;
    document.getElementById('edit-title').value = task.title;
    document.getElementById('edit-priority').value = task.priority ?? 3;
    document.getElementById('edit-date').value = task.due_date || '';
    document.getElementById('edit-modal').classList.add('open');
  }

  document.getElementById('edit-cancel').addEventListener('click', () => {
    document.getElementById('edit-modal').classList.remove('open');
    editingId = null;
  });

  document.getElementById('edit-modal').addEventListener('click', e => {
    if (e.target === e.currentTarget) {
      e.currentTarget.classList.remove('open');
      editingId = null;
    }
  });

  document.getElementById('edit-drop').addEventListener('click', async () => {
    if (!editingId) return;
    const id = editingId;
    const task = tasks.find(t => t.id === id);
    const name = task ? truncate(task.title) : '';
    document.getElementById('edit-modal').classList.remove('open');
    editingId = null;
    tasks = tasks.filter(t => t.id !== id);
    buildBoard();
    toast(`<span class="toast-action">Dropped</span><br><span class="toast-task">${name}</span>`);
    try {
      await patchTask(id, { status: 'dropped' });
      emitEvent(id, 'status_changed', 'open', 'dropped');
    } catch { /* best effort */ }
  });

  document.getElementById('edit-save').addEventListener('click', async () => {
    if (!editingId) return;
    const task = tasks.find(t => t.id === editingId);
    if (!task) return;

    const newTitle = document.getElementById('edit-title').value.trim();
    const newPriority = parseInt(document.getElementById('edit-priority').value);
    const newDate = document.getElementById('edit-date').value;

    const updates = {};
    if (newTitle && newTitle !== task.title) {
      updates.title = newTitle;
      emitEvent(editingId, 'title_changed', task.title, newTitle);
      task.title = newTitle;
    }
    if (newPriority !== task.priority) {
      emitEvent(editingId, 'priority_changed', String(task.priority), String(newPriority));
      updates.priority = newPriority;
      task.priority = newPriority;
    }
    if (newDate && newDate !== task.due_date) {
      emitEvent(editingId, 'deferred', task.due_date, newDate);
      updates.due_date = newDate;
      task.due_date = newDate;
    }

    document.getElementById('edit-modal').classList.remove('open');
    editingId = null;
    buildBoard();

    if (Object.keys(updates).length > 0) {
      const changes = [];
      if (updates.title) changes.push('title');
      if ('priority' in updates) changes.push(`priority → P${updates.priority}`);
      if (updates.due_date) changes.push(`date → ${friendlyDate(updates.due_date)}`);
      toast(`<span class="toast-action">Saved</span> ${changes.join(', ')}<br><span class="toast-task">${truncate(task.title)}</span>`);
      try { await patchTask(task.id, updates); }
      catch { toast('Save failed'); }
    }
  });

  // ── Load ────────────────────────────────────────────────────────────────
  async function loadTasks() {
    try {
      tasks = await fetchTasks();
      buildBoard();
      if (!SB_URL) toast('Demo mode');
    } catch (err) {
      toast('Error loading tasks');
      console.error(err);
    }
  }

  document.getElementById('refresh-btn').addEventListener('click', loadTasks);

  loadTasks();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>

</body>
</html>
